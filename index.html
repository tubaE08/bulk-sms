<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bulk SMS Sender</title>
<style>
*{box-sizing:border-box}
:root{--navy:#00334e;--deep:#001d2e;--or:#ff7a00;--or2:#ffa040}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:radial-gradient(circle at 20% 10%,#04507a,var(--navy) 45%,var(--deep));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow-x:hidden;position:relative}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.45;z-index:0;animation:float 14s ease-in-out infinite}
.b1{width:320px;height:320px;background:var(--or);top:-80px;right:-80px}
.b2{width:280px;height:280px;background:#0a8fd6;bottom:-60px;left:-70px;animation-delay:-5s}
.b3{width:200px;height:200px;background:#ff4d8d;top:45%;left:55%;animation-delay:-9s;opacity:.25}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-50px) scale(1.15)}}
.bub{position:fixed;bottom:-60px;z-index:0;width:34px;height:26px;border-radius:10px 10px 10px 2px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.wrap{position:relative;z-index:1;width:100%;max-width:400px;animation:in .8s cubic-bezier(.2,.9,.3,1.2)}
@keyframes in{from{opacity:0;transform:translateY(40px) scale(.95)}}
.logo{text-align:center;font-size:38px;font-weight:800;letter-spacing:-1.5px;margin-bottom:4px}
.logo{background:linear-gradient(90deg,#fff,#ffd29a,#fff);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite;filter:drop-shadow(0 4px 18px #ff7a0066)}
.logo span{color:var(--or);-webkit-text-fill-color:var(--or)}
.tag{text-align:center;font-size:12px;letter-spacing:3px;opacity:.7;margin-bottom:22px}
.card{background:rgba(255,255,255,.1);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.22);border-radius:28px;padding:26px;box-shadow:0 20px 60px #0006,inset 0 0 0 1px #fff1;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:-2px;background:conic-gradient(from 0deg,transparent,var(--or),transparent 30%);animation:spin 6s linear infinite;z-index:-1;border-radius:30px}
.card:after{content:"";position:absolute;inset:1px;background:linear-gradient(160deg,#0a4a6e,#00293f);border-radius:27px;z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.ic{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ff5e00,var(--or2));display:grid;place-items:center;font-size:22px;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ff7a0099}70%{box-shadow:0 0 0 14px #ff7a0000}}
.hd b{font-size:19px}.hd small{display:block;opacity:.65;font-size:12px}
label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;opacity:.75;margin:16px 0 6px}
.f{position:relative}
.f i{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-style:normal;opacity:.8}
input{width:100%;padding:14px 14px 14px 42px;border-radius:14px;border:1.5px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);color:#fff;font-size:16px;outline:none;transition:.25s}
input::placeholder{color:#fff6}
input:focus{border-color:var(--or);box-shadow:0 0 0 4px #ff7a0033;transform:translateY(-1px)}
button#b{width:100%;margin-top:22px;padding:15px;border:0;border-radius:16px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(90deg,#ff5e00,var(--or2),#ff5e00);background-size:200%;animation:sh 3s linear infinite;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
@keyframes sh{to{background-position:200%}}
button#b:active{transform:scale(.97)}
button#b:disabled{filter:grayscale(.7);opacity:.7;animation:none;cursor:not-allowed}
.bar{height:4px;border-radius:4px;background:#fff2;margin-top:12px;overflow:hidden;opacity:0;transition:.3s}
.bar.on{opacity:1}.bar div{height:100%;width:100%;background:var(--or);transform-origin:left;transition:transform 1s linear}
.note{font-size:11px;opacity:.6;text-align:center;margin-top:12px}
.foot{position:relative;z-index:1;margin-top:26px;font-size:13px;opacity:.85;text-align:center}
.foot b{background:linear-gradient(90deg,var(--or),#ffd29a,var(--or));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 3s linear infinite;font-size:15px}
.ov{position:fixed;inset:0;z-index:10;background:#000a;backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
.ov.show{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.pop{background:linear-gradient(160deg,#0a4a6e,#00293f);border:1px solid #fff3;border-radius:26px;padding:30px 24px;width:100%;max-width:340px;text-align:center;animation:pp .5s cubic-bezier(.2,1.4,.4,1);box-shadow:0 25px 70px #000a}
@keyframes pp{from{transform:scale(.5) translateY(40px);opacity:0}}
.ring{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-size:42px;background:#22c55e22;border:3px solid #22c55e;animation:pop2 .6s .15s both}
.ring.err{background:#ef444422;border-color:#ef4444;animation:shake .5s .15s}
.ring.wt{background:#ff7a0022;border-color:var(--or)}
@keyframes pop2{from{transform:scale(0) rotate(-90deg)}}
@keyframes shake{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
.pop h3{margin:0 0 6px;font-size:22px}.pop p{margin:0 0 20px;opacity:.8;font-size:14px;word-break:break-word}
.pop button{padding:12px 34px;border:0;border-radius:14px;background:var(--or);color:#fff;font-size:16px;font-weight:700}
.conf{position:fixed;top:-10px;width:9px;height:14px;z-index:11;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div class="wrap">
  <div class="logo">bulk<span>sms</span> 💬</div>
  <div class="tag">BULK SMS SENDER</div>
  <form class="card" id="f">
    <div class="hd"><div class="ic">👤</div><div><b>Bulk SMS Sender</b><small>Fast &amp; simple SMS</small></div></div>
    <label>Name</label>
    <div class="f"><i>🙍</i><input name="name" maxlength="40" placeholder="Your name" required></div>
    <label>Number</label>
    <div class="f"><i>📱</i><input name="number" type="tel" inputmode="numeric" maxlength="11" placeholder="01XXXXXXXXX" pattern="01[0-9]{9}" required></div>
    <label>Business Name</label>
    <div class="f"><i>🏪</i><input name="business_name" minlength="3" maxlength="50" placeholder="My Store (3-50 letters)" required></div>
    <button id="b">Send Message ➤</button>
    <div class="bar" id="bar"><div id="fill"></div></div>
    <div class="note">🛡️ Protected: 1 minute cooldown per user</div>
  </form>
</div>
<div class="foot">Developed by <b>Efty</b> ⚡</div>

<div class="ov" id="ov"><div class="pop"><div class="ring" id="ring"></div><h3 id="pt"></h3><p id="pm"></p><button id="ok">OK</button></div></div>

<script>
const $=id=>document.getElementById(id);
const f=$('f'),b=$('b'),ov=$('ov'),COOL=60;
// background bubbles
for(let i=0;i<14;i++){const e=document.createElement('div');e.className='bub';
e.style.left=Math.random()*100+'vw';e.style.animationDuration=8+Math.random()*10+'s';
e.style.animationDelay=-Math.random()*12+'s';e.style.transform='scale('+(.6+Math.random()*1.2)+')';document.body.appendChild(e);}
function popup(t,title,msg){$('ring').className='ring '+(t=='ok'?'':t);$('ring').textContent={ok:'✓',err:'✕',wt:'⏳'}[t];
$('pt').textContent=title;$('pm').textContent=msg;ov.classList.add('show');
if(t=='ok')for(let i=0;i<40;i++){const c=document.createElement('div');c.className='conf';
c.style.left=Math.random()*100+'vw';c.style.background=['#ff7a00','#22c55e','#38bdf8','#fff','#ff4d8d'][i%5];
c.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3000);}}
$('ok').onclick=()=>ov.classList.remove('show');
ov.onclick=e=>{if(e.target===ov)ov.classList.remove('show')};
let tm;
function cooldown(left){clearInterval(tm);$('bar').classList.add('on');b.disabled=true;
const tick=()=>{b.textContent='⏳ Wait '+left+'s';$('fill').style.transform='scaleX('+(left/COOL)+')';
if(left--<=0){clearInterval(tm);b.disabled=false;b.textContent='Send Message ➤';$('bar').classList.remove('on')}};
tick();tm=setInterval(tick,1000);}
function remaining(){try{const l=+localStorage.getItem('last')||0;return Math.max(0,COOL-Math.floor((Date.now()-l)/1000))}catch(_){return 0}}
if(remaining())cooldown(remaining());
f.addEventListener('submit',async e=>{
  e.preventDefault();
  const r0=remaining();if(r0){popup('wt','Please wait','আবার পাঠাতে '+r0+' সেকেন্ড অপেক্ষা করুন');return}
  b.disabled=true;b.textContent='Sending... ✈️';
  try{
    const r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});
    const d=await r.json();
    if(r.status==429){try{localStorage.setItem('last',Date.now()-(COOL-d.wait)*1000)}catch(_){}
      popup('wt','Please wait',d.error);cooldown(d.wait);return}
    if(d.ok){try{localStorage.setItem('last',Date.now())}catch(_){}
      popup('ok','Message Sent! 🎉',(d.message||'Successfully sent')+' → '+f.number.value);f.reset();cooldown(COOL);}
    else{popup('err','Failed',d.error||'Something went wrong');b.disabled=false;b.textContent='Send Message ➤'}
  }catch(_){popup('err','Network error','Internet check kore abar try korun');b.disabled=false;b.textContent='Send Message ➤'}
});
</script></body></html>
